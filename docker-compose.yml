version: "3.9"

services:
  emprestimo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca-emprestimo
    restart: unless-stopped

    ports:
      - "9500:9500"

    environment:
      PORT:        9500
      NODE_ENV:    production
      INFISICAL_ENV: prod

      # Banco de dados — vem do .env
      DATABASE_URL: ${DATABASE_URL}

      # RabbitMQ — se não vier do .env, usa o padrão da faculdade
      RABBITMQ_URL:             ${RABBITMQ_URL:-amqp://admin:adminadmin@academico3.rj.senac.br:5672}
      RABBITMQ_RECONNECT_DELAY: ${RABBITMQ_RECONNECT_DELAY:-5000}

      # Multa por dia de atraso
      VALOR_MULTA_DIA: ${VALOR_MULTA_DIA:-2.50}

    networks:
      - biblioteca-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  biblioteca-net:
    name: biblioteca-net
    driver: bridge
